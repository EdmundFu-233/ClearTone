name: ClearTone
options:
  bundleIdPrefix: com.cleartone
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  # ==========================================================
  # macOS 版
  # ==========================================================
  ClearTone:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ClearTone
        excludes:
          - "Resources/HelperRuntime/**"
          # iOS 专用源码（iOS target 才编）
          - "iOS/**"
      - path: ClearTone/Resources/HelperRuntime
        buildPhase: resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cleartone.app
        PRODUCT_NAME: 澄音
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: YES
        # 用稳定的开发证书签名（而非 ad-hoc）：签名身份固定后，
        # 钥匙串"始终允许"授权可跨重建保持，不再每次启动都要输密码
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ML3D4RN65N
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 ClearTone"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.music"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    entitlements:
      path: ClearTone/ClearTone.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
    dependencies: []

  # ==========================================================
  # iOS 版
  #
  # 与 macOS 版的差异：
  # - 无辅助进程（iOS 没有 Process()）→ NeteaseProvider 走 #if os(iOS) 直连
  # - 排除 macOS UI（NSWindow / MenuBarExtra / AppKit 的 NSImage）
  # - 保留已跨平台化的 PlayerController / AudioCacheManager / AppState
  # ==========================================================
  ClearToneiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ClearTone
        excludes:
          - "Resources/HelperRuntime/**"
          # macOS 专有 UI 与平台层
          - "App/ClearToneApp.swift"
          - "App/MainWindow.swift"
          - "App/PlayerBarView.swift"
          - "App/MiniPlayerView.swift"
          - "App/AppCommands.swift"
          - "Features/**"
          # iOS 没有 Process()，且 node 二进制是 macOS 的
          - "Core/Networking/HelperProcessManager.swift"
          # 依赖 NSViewRepresentable
          - "Rendering/AmbientBackgroundRenderer.swift"
          # AppKit 版封面加载；iOS 用 iOS/iOSCoverLoader.swift
          - "DesignSystem/CoverImage.swift"
      - path: ClearTone/Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cleartone.app.ios
        PRODUCT_NAME: 澄音
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ML3D4RN65N
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 澄音
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 ClearTone"
        # 后台播放：锁屏/切后台继续出声
        INFOPLIST_KEY_UIBackgroundModes: audio
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    dependencies: []

  # ==========================================================
  # 单元测试（macOS host）
  # ==========================================================
  ClearToneTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
      - path: ClearTone
        excludes:
          - "Resources/HelperRuntime/**"
          - "iOS/**"
          - "App/ClearToneApp.swift"
          - "App/MainWindow.swift"
          - "App/PlayerBarView.swift"
          - "App/MiniPlayerView.swift"
          - "App/AppCommands.swift"
          - "Features/**"
          # 注意：这里**不能**排除 HelperProcessManager.swift ——
          # NeteaseProvider.swift 在 macOS 分支里引用它，
          # 排除会导致 "cannot find type 'HelperProcessManager'"
          - "Rendering/AmbientBackgroundRenderer.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cleartone.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ML3D4RN65N

schemes:
  ClearTone:
    build:
      targets:
        ClearTone: all
        ClearToneTests: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClearToneTests
    archive:
      config: Release

  ClearToneiOS:
    build:
      targets:
        ClearToneiOS: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
