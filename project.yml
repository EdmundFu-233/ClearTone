name: ClearTone
options:
  bundleIdPrefix: com.cleartone
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

# 仅 macOS。曾经的 ClearToneiOS target 已移除：
# 它没有登录页、设置页、歌单详情页，是一个不完整的第二交付面。
# 若要恢复，见 git history（commit 在移除之前）。
targets:
  ClearTone:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ClearTone
        excludes:
          - "Resources/HelperRuntime/**"
      - path: ClearTone/Resources/HelperRuntime
        buildPhase: resources
        type: folder
    info:
      path: ClearTone/Resources/Info.plist
      properties:
        # `SongTransfer` 用 `UTType(exportedAs: "com.cleartone.song")` 承载
        # 「拖歌进队列」的拖放数据。`exportedAs` 语义上要求本进程**声明**这个
        # 类型：AppKit 头文件对 `+exportedTypeWithIdentifier:` 的说明是
        # 「若标识符不对应系统已知的任何类型，结果未定义」。
        # 之前只写了 `exportedAs` 而没有声明，LaunchServices 不认识该标识符，
        # 拖放要么静默失效要么抛 ObjC 异常。
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.cleartone.song
            UTTypeDescription: 澄音歌曲
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [cleartonesong]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cleartone.app
        PRODUCT_NAME: 澄音
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: YES
        # 用稳定的开发证书签名（而非 ad-hoc）：签名身份固定后，
        # 钥匙串"始终允许"授权可跨重建保持，不再每次启动都要输密码
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ML3D4RN65N
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 ClearTone"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.music"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    entitlements:
      path: ClearTone/ClearTone.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
    dependencies: []

  # ==========================================================
  # 单元测试（macOS host）
  # ==========================================================
  ClearToneTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
      - path: ClearTone
        excludes:
          - "Resources/HelperRuntime/**"
          # 以下文件依赖被排除的视图类型，或持有 AppKit 窗口/状态栏项，
          # 单测里既用不到也构造不出来。它们的**纯逻辑**都拆到了
          # Playback/SongTransfer.swift、App/MenuBarVisibilityPolicy.swift
          # 这些测试能编到的文件里。
          - "App/ClearToneApp.swift"
          - "App/MainWindow.swift"
          - "App/PlayerBarView.swift"
          - "App/MiniPlayerView.swift"
          - "App/MenuBarPlayerView.swift"
          - "App/AppCommands.swift"
          - "App/AppWindowController.swift"
          - "App/MenuBarController.swift"
          - "Features/**"
          # 注意：这里**不能**排除 HelperProcessManager.swift ——
          # NeteaseProvider 引用它，排除会报
          # "cannot find type 'HelperProcessManager'"
          - "Rendering/AmbientBackgroundRenderer.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cleartone.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ML3D4RN65N

schemes:
  ClearTone:
    build:
      targets:
        ClearTone: all
        ClearToneTests: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClearToneTests
    archive:
      config: Release
