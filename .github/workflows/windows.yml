name: Windows (Qt/C++)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.12.0'

jobs:
  # 编译 + 全部离线单测（win-x64）
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Qt（${{ env.QT_VERSION }} MinGW 13.1）
        shell: pwsh
        run: |
          # aqtinstall 3.3.0 on PyPI looks for qt6_6120/qt6_6120/Updates.xml;
          # Qt 6.11+ split Windows metadata by architecture. Pin the upstream fix.
          python -m pip install --upgrade pip
          python -m pip install 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_mingw --outputdir C:\Qt -m qtmultimedia qtshadertools
          python -m aqt install-tool windows desktop tools_mingw1310 qt.tools.win64_mingw1310 --outputdir C:\Qt
          $kit = Get-ChildItem "C:\Qt\$env:QT_VERSION" -Directory | Where-Object { $_.Name -match '^mingw.*64$' } | Select-Object -First 1
          if (-not $kit) { throw '未找到 Qt kit' }
          "QT_ROOT=$($kit.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # 测试可执行文件运行时需要能找到 Qt DLL，否则 Windows 弹缺库对话框并卡死
          "$($kit.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          'C:\Qt\Tools\mingw1310_64\bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          if (-not (Test-Path (Join-Path $kit.FullName 'lib\cmake\Qt6Test'))) {
            throw '缺少 Qt Test 模块，无法注册离线测试'
          }

      - name: Rust GNU helper tests and build
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-gnu
          cargo test --manifest-path windows/helper/Cargo.toml --locked --target x86_64-pc-windows-gnu
          cargo build --manifest-path windows/helper/Cargo.toml --release --locked --target x86_64-pc-windows-gnu

      - name: CMake 配置
        shell: pwsh
        run: >
          cmake -S windows -B windows/build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release
          "-DCMAKE_PREFIX_PATH=$env:QT_ROOT" -DCMAKE_CXX_COMPILER=g++

      - name: 构建（Release）
        run: cmake --build windows/build-ci -j

      - name: 离线单测
        shell: pwsh
        run: |
          # 原生命令非零退出在 pwsh 7.3+ 可能被当终止错误，导致失败诊断跑不到
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $listed = ctest --test-dir windows/build-ci -N
          if (-not ($listed | Select-String 'Test  #1:')) {
            throw '没有注册任何测试（Qt Test 未找到或 tests 未加入构建）'
          }
          ctest --test-dir windows/build-ci --output-on-failure
          $ctestCode = $LASTEXITCODE
          if ($ctestCode -ne 0) {
            # GUI 测试的 stdout 在 ctest 里可能丢失；让它把报告写文件再打印。
            $env:CLEARTONE_TEST_STORAGE_DIR = Join-Path $env:RUNNER_TEMP 'ct-gui-report'
            New-Item -ItemType Directory -Force -Path $env:CLEARTONE_TEST_STORAGE_DIR | Out-Null
            $report = Join-Path $env:RUNNER_TEMP 'gui-report.txt'
            & windows/build-ci/tests/tst_gui_layout.exe -o $report,txt
            Write-Host "tst_gui_layout exit=$LASTEXITCODE"
            Get-Content $report -ErrorAction SilentlyContinue
            throw "离线单测失败：ctest 退出码 $ctestCode"
          }

      # 启动冒烟：起辅助进程、跑事件循环、加载封面，捕捉“启动即闪退”类问题。
      - name: 启动冒烟（构建产物）
        shell: pwsh
        run: |
          $env:CLEARTONE_HELPER_BINARY = (Resolve-Path 'windows/helper/target/x86_64-pc-windows-gnu/release/cleartone-helper.exe').Path
          $env:QT_QPA_PLATFORM = 'offscreen'
          # GUI 子系统进程必须用 Start-Process -Wait，`&` 不等它结束也拿不到退出码
          $proc = Start-Process -FilePath 'windows/build-ci/ClearTone.exe' `
            -ArgumentList '--smoke-test', '20' -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            Get-Content "$env:LOCALAPPDATA\ClearTone\ClearTone\logs\cleartone.log" -Tail 60 -ErrorAction SilentlyContinue
            throw "冒烟测试失败：退出码 $($proc.ExitCode)"
          }

  # 发布包：tag 推送或手动触发时，构建 win-x64 的 zip
  package:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Qt（${{ env.QT_VERSION }} MinGW 13.1）
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7'
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_mingw --outputdir C:\Qt -m qtmultimedia qtshadertools
          python -m aqt install-tool windows desktop tools_mingw1310 qt.tools.win64_mingw1310 --outputdir C:\Qt
          $kit = Get-ChildItem "C:\Qt\$env:QT_VERSION" -Directory |
            Where-Object { $_.Name -match '^mingw.*64$' } | Select-Object -First 1
          if (-not $kit) { throw '未找到 Qt kit' }
          "QT_ROOT=$($kit.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 打包（win-x64）
        shell: pwsh
        run: >
          pwsh -NoProfile -ExecutionPolicy Bypass -File windows/scripts/build-app.ps1
          -Arch x64 -QtRoot "$env:QT_ROOT" -Generator Ninja

      - name: 启动冒烟（win-x64 发布包）
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath 'windows/publish/win-x64/ClearTone.exe' `
            -ArgumentList '--smoke-test', '20' -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            Get-Content "$env:LOCALAPPDATA\ClearTone\ClearTone\logs\cleartone.log" -Tail 60 -ErrorAction SilentlyContinue
            throw "发布包冒烟失败：退出码 $($proc.ExitCode)"
          }

      - name: 列出产物内容
        shell: pwsh
        run: |
          Get-ChildItem -Recurse 'windows/publish/win-x64' |
            Select-Object -ExpandProperty FullName | ForEach-Object { Write-Host $_ }

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ClearTone-win-x64
          path: windows/publish/ClearTone-win-x64.zip
          if-no-files-found: error

  # tag 推送时用 x64 产物创建 GitHub Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 创建/更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -la artifacts
          # 该 job 未 checkout，gh 需要显式 -R 指定仓库
          if ! gh release view "$TAG" -R "$REPO"; then
            gh release create "$TAG" -R "$REPO" --title "澄音 ClearTone ${TAG#v}" --generate-notes
          fi
          gh release upload "$TAG" artifacts/ClearTone-win-x64.zip -R "$REPO" --clobber
